    :root {

      --card-bg: rgba(32, 42, 68, 0.9);

      --primary-yellow: #fffb00;
      --accent-blue: #4845a9;
      --accent-green: #39ff14;
      --accent-red: #ff006f;
      --text-main: #fcfdfe;
      --text-sub: #fdfcfc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Vazirmatn', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(112, 0, 255, 0.15), transparent 60%),
        radial-gradient(circle at 10% 80%, rgba(0, 243, 255, 0.1), transparent 50%),

      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      color: var(--text-main);
      min-height: 100vh;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    /* Header Section */
    .header {
      text-align: center;
      margin-bottom: 16px;
    }

    .header-logo {
      width: 110px;
      height: 110px;
      object-fit: cover;
      border-radius: 50%;
      margin: 0 auto 10px auto;
      display: block;
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.4);
      border: 3px solid var(--primary-yellow);
    }

    .header-title {
      font-size: 32px;
      font-weight: 900;
      color: var(--primary-yellow);
      text-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
      margin-bottom: 2px;
    }

    .header-subtitle {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-sub);
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .header-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .btn-header {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      backdrop-filter: blur(5px);
    }

    .btn-header.phone { color: var(--primary-yellow); border-color: rgba(0, 243, 255, 0.4); }
    .btn-header.whatsapp { color: var(--accent-green); border-color: rgba(57, 255, 20, 0.4); }

    /* Storage Selector Card */
    .storage-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 14px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .storage-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 13px;
      font-weight: 700;
    }

    .storage-select {
      background: #0f172a;
      color: var(--primary-yellow);
      border: 1px solid var(--primary-yellow);
      padding: 4px 10px;
      border-radius: 8px;
      font-weight: 700;
      outline: none;
      cursor: pointer;
      font-size: 12px;
    }

    .progress-bg {
      background: rgba(255, 255, 255, 0.08);
      height: 8px;
      border-radius: 6px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary-yellow), var(--accent-green));
      box-shadow: 0 0 10px var(--primary-yellow);
      transition: width 0.3s ease;
    }

    /* Search & Categories */
    .search-box {
      margin-bottom: 12px;
    }

    .search-input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      outline: none;
      backdrop-filter: blur(10px);
    }

    .search-input:focus {
      border-color: var(--primary-yellow);
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
    }

    .categories-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 14px;
      scrollbar-width: thin;
    }

    .cat-btn {
      background: var(--card-bg);
      color: var(--text-sub);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      backdrop-filter: blur(5px);
    }

    .cat-btn.active {
      background: var(--primary-yellow);
      color: #05070b;
      border-color: var(--primary-yellow);
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
    }

    /* Actions Bar */
    .actions-bar {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
    }

    .btn-send {
      flex: 2;
      background: var(--primary-yellow);
      color: #05070b;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.3);
    }

    .btn-clear {
      flex: 1;
      background: rgba(255, 0, 127, 0.15);
      color: var(--accent-red);
      border: 1px solid rgba(255, 0, 127, 0.3);
      padding: 10px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }

    /* Games Grid - Optimized for Mobile */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
      gap: 10px;
    }

    .game-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      display: flex;
      flex-direction: column;
      transition: all 0.2s;
      backdrop-filter: blur(10px);
    }

    .game-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.6);
    }

    .game-card.selected {
      border-color: var(--primary-yellow);
      box-shadow: 0 0 14px rgba(0, 243, 255, 0.4);
    }

    /* Compact Cover Image Style */
    .game-image-container {
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #0f172a;
      overflow: hidden;
      position: relative;
    }

    .game-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .game-details {
      padding: 6px;
      text-align: center;
      background: rgba(15, 23, 42, 0.95);
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .game-title {
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 3px;
      color: var(--text-main);

      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.25;
      height: 2.5em;
    }
#f70052

      color: #05070b;

        gap: 8px;

    let selectedGameIds = [];
    let currentCategory = 'all';

    function filterCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderGames();
    }

    function renderGames() {
      const grid = document.getElementById('gamesGrid');
      grid.innerHTML = '';

      const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();

      const filtered = games.filter(game => {
        const matchesCategory = (currentCategory === 'all' || game.category === currentCategory);
        const matchesSearch = game.title.toLowerCase().includes(searchTerm);
        return matchesCategory && matchesSearch;
      });

      filtered.sort((a, b) => a.title.localeCompare(b.title));

      filtered.forEach(game => {
        const isSelected = selectedGameIds.includes(game.id);
        const card = document.createElement('div');
        card.className = `game-card ${isSelected ? 'selected' : ''}`;
        card.onclick = () => toggleSelectGame(game.id);

        card.innerHTML = `
          <div class="check-box">✓</div>
          <div class="game-image-container">
            <img class="game-image" src="${game.img}" alt="${game.title}" onerror="this.src='https://via.placeholder.com/150x200/0f172a/ffffff?text=No+Image'">
          </div>
          <div class="game-details">
            <div class="game-title">${game.title}</div>
            <div class="game-size">GB ${game.size}</div>
          </div>
        `;
        grid.appendChild(card);
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; padding: 25px; text-align:center; color: var(--text-sub);">هیچ یاریەیەک نەدۆزرایەوە 🔍</div>`;
      }

      updateUI();
    }

    function toggleSelectGame(id) {
      if (selectedGameIds.includes(id)) {
        selectedGameIds = selectedGameIds.filter(gId => gId !== id);
      } else {
        selectedGameIds.push(id);
      }
      renderGames();
    }

    function updateUI() {
      let total = 0;
      games.forEach(game => {
        if (selectedGameIds.includes(game.id)) {
          total += game.size;
        }
      });

      document.getElementById('totalSize').innerText = total.toFixed(2);
      document.getElementById('selectedCount').innerText = selectedGameIds.length;

      const maxStorage = parseFloat(document.getElementById('maxStorage').value);
      const percentage = Math.min((total / maxStorage) * 100, 100);
      document.getElementById('progressBar').style.width = percentage + '%';
    }

    function clearAll() {
      selectedGameIds = [];
      renderGames();
    }

    function sendOrder() {
      if (selectedGameIds.length === 0) {
        alert("تکایە سەرەتا چەند یاریەک دیاری بکه!");
        return;
      }

      let text = "سڵاو، داواکاری ئەم یاریانەم هەبوو:\n\n";
      let totalGB = 0;

      games.forEach(game => {
        if (selectedGameIds.includes(game.id)) {
          text += `• ${game.title} (${game.size} GB)\n`;
          totalGB += game.size;
        }
      });

      text += `\nکۆی قەبارە: ${totalGB.toFixed(2)} GB`;

      const phone = "9647515340107";
      window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`, '_blank');
    }

    renderGames();
  </script>
