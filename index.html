<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAWKARATARY - Yari Play2</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-yellow: #facc15;
      --accent-green: #22c55e;
      --text-color: #f8fafc;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
      text-align: center;
    }

    .header h1 {
      color: var(--accent-yellow);
      margin-bottom: 5px;
      text-shadow: 0 0 10px rgba(250, 204, 21, 0.3);
    }

    .storage-box {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 10px;
      max-width: 500px;
      margin: 0 auto 20px auto;
      border: 1px solid #334155;
    }
    .progress-bar-container {
      background-color: #334155;
      height: 20px;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 10px;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ca8a04, #facc15);
      transition: width 0.3s ease;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .btn {
      background-color: var(--accent-yellow);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-danger {
      background-color: #ef4444;
      color: white;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 15px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .game-card {
      background-color: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
    }
    .game-card.selected {
      border-color: var(--accent-yellow);
      box-shadow: 0 0 12px rgba(250, 204, 21, 0.5);
    }
    .game-card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
      background-color: #0f172a;
    }
    .game-info {
      padding: 8px;
    }
    .game-title {
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .game-size {
      font-size: 11px;
      color: var(--accent-yellow);
      font-weight: bold;
      margin-top: 5px;
    }
    .game-checkbox {
      accent-color: var(--accent-yellow);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-content {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      border: 1px solid var(--accent-yellow);
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 10px; left: 10px;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 50%;
      width: 25px; height: 25px;
      cursor: pointer;
    }
    .selected-list {
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
      max-height: 150px;
      overflow-y: auto;
      text-align: right;
      font-size: 13px;
      margin: 15px 0;
    }
    .modal-btn {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border-radius: 6px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-copy { background: var(--accent-yellow); color: black; }
    .btn-order { background: var(--accent-green); color: white; }
  </style>
</head>
<body>

  <div class="header">
    <h1>HAWKARATARY 
      0751 534 0107</h1>
  </div>

  <div class="storage-box">
    <div>بڕی دیاریکراو: <span id="totalSize">0.00</span> GB / 
      <select id="maxStorage" onchange="updateUI()">
        <option value="64">Flash 64GB</option>
        <option value="320">Hard 320GB</option>
      </select>
    </div>
    <div class="progress-bar-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>

  <div class="btn-group">
    <button class="btn" onclick="openModal()">ناردنی یاریەکان</button>
    <button class="btn btn-danger" onclick="clearAll()">لابردنی یاریە دیاریکراوەکان</button>
  </div>

  <div class="games-grid" id="gamesGrid"></div>

  <div class="modal" id="orderModal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">✕</button>
      <h3>یاریە دیاریکراوەکان</h3>
      <div class="selected-list" id="selectedListText"></div>
      <button class="modal-btn btn-copy" onclick="copyList()">کۆپیکردن</button>
      <button class="modal-btn btn-order" onclick="sendWhatsApp()">داواکردنی یاری بۆ پلەی دوو (WhatsApp)</button>
    </div>
  </div>

  <script>
    const games = [
      { id: 1, name: "007 Agent Under Fire", size: 3.74, img: "007.jpg" },
      { id: 2, name: "007 Everything or Nothing", size: 3.25, img: "007two.jpg" },
      { id: 3, name: "007 Nightfire", size: 3.72, img: "nightfire.jpg" },
      { id: 4, name: "Conflict Desert Storm", size: 3.93, img: "desert.jpg" },
      { id: 5, name: "Conflict Desert Storm II", size: 2.14, img: "desert2.jpg" },
      { id: 6, name: "Devil May Cry 3", size: 4.37, img: "dmc3.jpg" },
      { id: 7, name: "50 Cent Bulletproof", size: 5.94, img: "50cent.jpg" }
    ];

    let selectedGameIds = [];

    function renderGames() {
      const grid = document.getElementById('gamesGrid');
      grid.innerHTML = '';
      
      games.forEach(game => {
        const isSelected = selectedGameIds.includes(game.id);
        const card = document.createElement('div');
        card.className = `game-card ${isSelected ? 'selected' : ''}`;
        card.onclick = () => toggleSelectGame(game.id);

        card.innerHTML = `
          <img src="${game.img}" alt="${game.name}" onerror="this.src='https://placehold.co/150x200/1e293b/facc15?text=${encodeURIComponent(game.name)}'">
          <div class="game-info">
            <div class="game-title">${game.name}</div>
            <div class="game-size">${game.size} GB</div>
            <input type="checkbox" class="game-checkbox" ${isSelected ? 'checked' : ''}>
          </div>
        `;
        grid.appendChild(card);
      });
      updateUI();
    }

    function toggleSelectGame(id) {
      if (selectedGameIds.includes(id)) {
        selectedGameIds = selectedGameIds.filter(gId => gId !== id);
      } else {
        selectedGameIds.push(id);
      }
      renderGames();
    }

    function updateUI() {
      let total = 0;
      games.forEach(game => {
        if (selectedGameIds.includes(game.id)) {
          total += game.size;
        }
      });

      document.getElementById('totalSize').innerText = total.toFixed(2);
      
      const maxStorage = parseFloat(document.getElementById('maxStorage').value);
      const percentage = Math.min((total / maxStorage) * 100, 100);
      document.getElementById('progressBar').style.width = percentage + '%';
    }

    function clearAll() {
      selectedGameIds = [];
      renderGames();
    }

    function openModal() {
      if(selectedGameIds.length === 0) {
        alert("تکایە سەرەتا چەند یاریەک دیاری بکه!");
        return;
      }
      
      const listContainer = document.getElementById('selectedListText');
      let text = "";
      let totalGB = 0;

      games.forEach(game => {
        if (selectedGameIds.includes(game.id)) {
          text += `• ${game.name}<br>`;
          totalGB += game.size;
        }
      });

      text += `<br><b>ئەو یاریانەم دەوێ بە کۆدی: ${totalGB.toFixed(2)} GB</b>`;
      listContainer.innerHTML = text;

      document.getElementById('orderModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('orderModal').style.display = 'none';
    }

    function copyList() {
      const listContainer = document.getElementById('selectedListText');
      const plainText = listContainer.innerText;
      navigator.clipboard.writeText(plainText);
      alert("لیستی یارییەکان کۆپی کرا!");
    }

    function sendWhatsApp() {
      const phone = "9647515340107";
      const listContainer = document.getElementById('selectedListText');
      const text = encodeURIComponent(listContainer.innerText);
      window.open(`https://wa.me/${phone}?text=${text}`, '_blank');
    }

    renderGames();
  </script>
</body>
</html>
