<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پیشانگای ئاکار - HAWKAR ATARY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0f131d;
      --card-bg: rgba(23, 30, 46, 0.85);
      --card-border: rgba(250, 204, 21, 0.25);
      --primary-yellow: #facc15;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-red: #f43f5e;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Vazirmatn', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    /* Header Section */
    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header-title {
      font-size: 38px;
      font-weight: 900;
      color: var(--primary-yellow);
      text-shadow: 0 0 20px rgba(250, 204, 21, 0.4);
      margin-bottom: 2px;
    }

    .header-subtitle {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent-blue);
      letter-spacing: 2px;
      margin-bottom: 15px;
    }

    .header-buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .btn-header {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .btn-header.phone { color: var(--primary-yellow); border-color: rgba(250, 204, 21, 0.4); }
    .btn-header.whatsapp { color: var(--accent-green); border-color: rgba(16, 185, 129, 0.4); }

    /* Storage Selector Card */
    .storage-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .storage-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 700;
    }

    .storage-select {
      background: #1e293b;
      color: var(--primary-yellow);
      border: 1px solid var(--primary-yellow);
      padding: 6px 14px;
      border-radius: 10px;
      font-weight: 700;
      outline: none;
      cursor: pointer;
    }

    .progress-bg {
      background: rgba(255, 255, 255, 0.08);
      height: 10px;
      border-radius: 8px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--primary-yellow);
      transition: width 0.3s ease;
    }

    /* Search & Categories */
    .search-box {
      margin-bottom: 14px;
    }

    .search-input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
    }

    .categories-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
    }

    .cat-btn {
      background: #1e293b;
      color: var(--text-sub);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .cat-btn.active {
      background: var(--primary-yellow);
      color: #000;
      border-color: var(--primary-yellow);
    }

    /* Actions Bar */
    .actions-bar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .btn-send {
      flex: 2;
      background: var(--primary-yellow);
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
    }

    .btn-clear {
      flex: 1;
      background: rgba(244, 63, 94, 0.15);
      color: var(--accent-red);
      border: 1px solid rgba(244, 63, 94, 0.3);
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    /* Games Grid */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 14px;
    }

    .game-card {
      background: var(--card-bg);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      display: flex;
      flex-direction: column;
      transition: all 0.2s;
    }

    .game-card.selected {
      border-color: var(--primary-yellow);
      box-shadow: 0 0 15px rgba(250, 204, 21, 0.3);
    }

    /* بخش تصویر بازی */
    .game-image {
      width: 100%;
      height: 160px;
      object-fit: cover;
      background: #1e293b;
    }

    .game-details {
      padding: 10px;
      text-align: center;
      background: rgba(15, 19, 29, 0.9);
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .game-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text-main);
    }

    .game-size {
      font-size: 12px;
      font-weight: 800;
      color: var(--primary-yellow);
    }

    .check-box {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: transparent;
      font-size: 12px;
    }

    .game-card.selected .check-box {
      background: var(--primary-yellow);
      color: #000;
      border-color: var(--primary-yellow);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-title">پیشانگای ئاکار</div>
      <div class="header-subtitle">HAWKAR ATARY</div>
      <div class="header-buttons">
        <a href="tel:07515340107" class="btn-header phone">📞 07515340107</a>
        <a href="https://wa.me/9647515340107" target="_blank" class="btn-header whatsapp">💬 واتسئاپ</a>
      </div>
    </div>

    <!-- Storage Selector -->
    <div class="storage-card">
      <div class="storage-row">
        <div>کۆی قەبارە: <span id="totalSize" style="color:var(--primary-yellow)">0.00</span> GB</div>
        <div>
          قەبارەی فلاش دیاری بکه:
          <select id="maxStorage" class="storage-select" onchange="updateUI()">
            <option value="64">Flash 64 GB</option>
            <option value="320">Hard 320 GB</option>
          </select>
        </div>
      </div>
      <div class="progress-bg">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>

    <!-- Search Box -->
    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 گەڕان بەدوای ناوی یاری (نموونه: Call of Duty, Ben 10, Bully)..." oninput="renderGames()">
    </div>

    <!-- Categories Filter -->
    <div class="categories-row">
      <button class="cat-btn active" onclick="filterCategory('all', this)">💛 هەموو</button>
      <button class="cat-btn" onclick="filterCategory('action', this)">🔫 ئاکشن & شووتەر</button>
      <button class="cat-btn" onclick="filterCategory('war', this)">🪖 جەنگی</button>
      <button class="cat-btn" onclick="filterCategory('horror', this)">👻 ترسانک</button>
      <button class="cat-btn" onclick="filterCategory('cartoon', this)">📺 کارتۆن & ئەنیمی</button>
    </div>

    <!-- Actions -->
    <div class="actions-bar">
      <button class="btn-send" onclick="sendOrder()">🚀 ناردنی داواکاری (<span id="selectedCount">0</span>)</button>
      <button class="btn-clear" onclick="clearAll()">🗑️ پاککردنەوەی هەمووی</button>
    </div>

    <!-- Games Grid -->
    <div class="games-grid" id="gamesGrid"></div>
  </div>

  <script>
    // ----------------------------------------------------
    // لیست یاری‌ها + محل آدرس عکس (img)
    // آدرس عکس‌های خود را در بخش img جایگزین کنید
    // ----------------------------------------------------
    const games = [
      { 
        id: 1, 
        title: "Call of Duty: World at War", 
        size: 3.93, 
        category: "war", 
        img: "1.jpg" 
      },
      { 
        id: 2, 
        title: "Conflict Desert Storm II", 
        size: 2.14, 
        category: "war", 
        img: "2.png" 
      },
      { 
        id: 3, 
        title: "007Agent Under Fire", 
        size: 3.74, 
        category: "action", 
        img: "https://via.placeholder.com/150x200/1e293b/facc15?text=007+Agent" 
      },
      { 
        id: 4, 
        title: "007Everything or Nothing", 
        size: 3.25, 
        category: "action", 
        img: "https://via.placeholder.com/150x200/1e293b/facc15?text=007+Everything" 
      },
      { 
        id: 5, 
        title: "Devil May Cry 3", 
        size: 4.37, 
        category: "action", 
        img: "7.png" 
      },
      { 
        id: 6, 
        title: "Resident Evil 4", 
        size: 4.20, 
        category: "horror", 
        img: "8.jpg" 
      },
      { 
        id: 7, 
        title: "Ben 10 Alien Force", 
        size: 1.80, 
        category: "cartoon", 
        img: "9.jpg" 
      },
      {
        id: 8, 
        title: "GOD OF WAR 2", 
        size: 7.89, 
        category: "action", 
        img: "10.png" 
      },
      {
        id: 9, 
        title: "GOD HAND", 
        size: 2.39, 
        category: "cartoon", 
        img: "11.jpg" 
      },
      {
       id: 12, 
       title: "DOWNHILL", 
       size: 2.20, 
       category: "action", 
       img: "12.png"
      },
      {
       id: 13, 
       title: "Angry Birds", 
       size: 2.10, 
       category: "action", 
       img: "13.jpg"
      },
      { 
       id: 14, 
       title: "24The Game", 
       size: 3.5, 
       category: "action", 
       img: "14.png"
      },
      { 
       id: 15, 
       title: "Alone in the Dark", 
       size: 3.5, 
       category: "action", 
       img: "15.jpg"
      },
      { 
       id: 16, 
       title: "Altered Beast", 
       size: 3.5, 
       category: "action", 
       img: "16.png"
      }
    ];

    let selectedGameIds = [];
    let currentCategory = 'all';

    function filterCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderGames();
    }

    function renderGames() {
      const grid = document.getElementById('gamesGrid');
      grid.innerHTML = '';

      const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();

      const filtered = games.filter(game => {
        const matchesCategory = (currentCategory === 'all' || game.category === currentCategory);
        const matchesSearch = game.title.toLowerCase().includes(searchTerm);
        return matchesCategory && matchesSearch;
      });

      filtered.forEach(game => {
        const isSelected = selectedGameIds.includes(game.id);
        const card = document.createElement('div');
        card.className = `game-card ${isSelected ? 'selected' : ''}`;
        card.onclick = () => toggleSelectGame(game.id);

        card.innerHTML = `
          <div class="check-box">✓</div>
          <img class="game-image" src="${game.img}" alt="${game.title}" onerror="this.src='https://via.placeholder.com/150x200/1e293b/ffffff?text=No+Image'">
          <div class="game-details">
            <div class="game-title">${game.title}</div>
            <div class="game-size">GB ${game.size}</div>
          </div>
        `;
        grid.appendChild(card);
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; padding: 30px; text-align:center; color: var(--text-sub);">هیچ یاریەیەک نەدۆزرایەوە 🔍</div>`;
      }

      updateUI();
    }

    function toggleSelectGame(id) {
      if (selectedGameIds.includes(id)) {
        selectedGameIds = selectedGameIds.filter(gId => gId !== id);
      } else {
        selectedGameIds.push(id);
      }
      renderGames();
    }

    function updateUI() {
      let total = 0;
      games.forEach(game => {
        if (selectedGameIds.includes(game.id)) {
          total += game.size;
        }
      });

      document.getElementById('totalSize').innerText = total.toFixed(2);
      document.getElementById('selectedCount').innerText = selectedGameIds.length;

      const maxStorage = parseFloat(document.getElementById('maxStorage').value);
      const percentage = Math.min((total / maxStorage) * 100, 100);
      document.getElementById('progressBar').style.width = percentage + '%';
    }

    function clearAll() {
      selectedGameIds = [];
      renderGames();
    }

    function sendOrder() {
      if (selectedGameIds.length === 0) {
        alert("تکایە سەرەتا چەند یاریەک دیاری بکه!");
        return;
      }

      let text = "سڵاو، داواکاری ئەم یاریانەم هەبوو:\n\n";
      let totalGB = 0;

      games.forEach(game => {
        if (selectedGameIds.includes(game.id)) {
          text += `• ${game.title} (${game.size} GB)\n`;
          totalGB += game.size;
        }
      });

      text += `\nکۆی قەبارە: ${totalGB.toFixed(2)} GB`;

      const phone = "9647515340107";
      window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`, '_blank');
    }

    renderGames();
  </script>
</body>
</html>
