    :root {
      --bg-dark: #0f131d;
      --card-bg: rgba(23, 30, 46, 0.85);
      --card-border: rgba(246, 198, 8, 0.63);
      --primary-yellow: lab(90.71% -9.43 89.83);
      --accent-blue: oklab(54.691% -0.0274 -0.24545);
      --accent-green: #10b981;
      --accent-red: #ffffff;
      --text-main: lch(100% 0.01 296.81);
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Vazirmatn', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    /* Header Section */
    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header-logo {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 50%;
      margin: 0 auto 12px auto;
      display: block;
      box-shadow: 0 0 25px rgb(232, 209, 3);
      border: 2px solid rgb(11, 11, 10);
    }

    .header-title {
      font-size: 45px;
      font-weight: 900;
      color: var(--primary-blue);
      text-shadow: 0 0 20px rgba(255, 0, 0, 0.438);
      margin-bottom: 2px;
    }

    .header-subtitle {
      font-size: 15pxpx;
      font-weight: 700;
      color: var(--primary-yellow);
      letter-spacing: 3px;
      margin-bottom: 15px;
    }

    .header-buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .btn-header {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .btn-header.phone { color: var(--primary-yellow); border-color: rgba(250, 204, 21, 0.4); }
    .btn-header.whatsapp { color: var(--accent-green); border-color: rgba(16, 185, 129, 0.4); }

    /* Storage Selector Card */
    .storage-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .storage-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 700;
    }

    .storage-select {
      background: #1e293b;
      color: var(--primary-yellow);
      border: 1px solid var(--primary-yellow);
      padding: 6px 14px;
      border-radius: 10px;
      font-weight: 700;
      outline: none;
      cursor: pointer;
    }

    .progress-bg {
      background: rgba(255, 255, 255, 0.08);
      height: 10px;
      border-radius: 8px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--primary-yellow);
      transition: width 0.3s ease;
    }

    /* Search & Categories */
    .search-box {
      margin-bottom: 14px;
    }

    .search-input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
    }

    .categories-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
    }

    .cat-btn {
      background: #1e293b;
      color: var(--text-sub);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .cat-btn.active {
      background: var(--primary-yellow);
      color: #000;
      border-color: var(--primary-yellow);
    }

    /* Actions Bar */
    .actions-bar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .btn-send {
      flex: 2;
      background: var(--primary-yellow);
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
    }

    .btn-clear {
      flex: 1;
      background: rgba(244, 63, 94, 0.15);
      color: var(--accent-red);
      border: 1px solid rgba(244, 63, 94, 0.3);
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    /* Games Grid */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 14px;
    }

    .game-card {
      background: var(--card-bg);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      display: flex;
      flex-direction: column;
      transition: all 0.2s;
    }

    .game-card.selected {
      border-color: var(--primary-yellow);
      box-shadow: 0 0 15px rgba(250, 204, 21, 0.3);
    }

    /* بخش تصویر بازی */
    .game-image {
      width: 100%;
      height: 160px;
      object-fit: cover;
      background: #1e293b;
    }

    .game-details {
      padding: 10px;
      text-align: center;
      background: rgba(15, 19, 29, 0.9);
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .game-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text-main);
    }

    .game-size {
      font-size: 12px;
      font-weight: 800;
      color: var(--primary-yellow);
    }

    .check-box {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: transparent;
      font-size: 12px;
    }

    .game-card.selected .check-box {
      background: var(--primary-yellow);
      color: #000;
      border-color: var(--primary-yellow);
    }
  </style>
</head>

    <div class="games-grid" id="gamesGrid"></div>

    let selectedGameIds = [];
    let currentCategory = 'all';

    function filterCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderGames();
    }

    function renderGames() {
      const grid = document.getElementById('gamesGrid');
      grid.innerHTML = '';

      const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();

      const filtered = games.filter(game => {
        const matchesCategory = (currentCategory === 'all' || game.category === currentCategory);
        const matchesSearch = game.title.toLowerCase().includes(searchTerm);
        return matchesCategory && matchesSearch;
      });

      filtered.forEach(game => {
        filtered.sort((a, b) => a.title.localeCompare(b.title));
        const isSelected = selectedGameIds.includes(game.id);
        const card = document.createElement('div');
        card.className = `game-card ${isSelected ? 'selected' : ''}`;
        card.onclick = () => toggleSelectGame(game.id);

        card.innerHTML = `
          <div class="check-box">✓</div>
          <img class="game-image" src="${game.img}" alt="${game.title}" onerror="this.src='https://via.placeholder.com/150x200/1e293b/ffffff?text=No+Image'">
          <div class="game-details">
            <div class="game-title">${game.title}</div>
            <div class="game-size">GB ${game.size}</div>
          </div>
        `;
        grid.appendChild(card);
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; padding: 30px; text-align:center; color: var(--text-sub);">هیچ یاریەیەک نەدۆزرایەوە 🔍</div>`;
      }

      updateUI();
    }

    function toggleSelectGame(id) {
      if (selectedGameIds.includes(id)) {
        selectedGameIds = selectedGameIds.filter(gId => gId !== id);
      } else {
        selectedGameIds.push(id);
      }
      renderGames();
    }

    function updateUI() {
      let total = 0;
      games.forEach(game => {
        if (selectedGameIds.includes(game.id)) {
          total += game.size;
        }
      });

      document.getElementById('totalSize').innerText = total.toFixed(2);
      document.getElementById('selectedCount').innerText = selectedGameIds.length;

      const maxStorage = parseFloat(document.getElementById('maxStorage').value);
      const percentage = Math.min((total / maxStorage) * 100, 100);
      document.getElementById('progressBar').style.width = percentage + '%';
    }

    function clearAll() {
      selectedGameIds = [];
      renderGames();
    }

    function sendOrder() {
      if (selectedGameIds.length === 0) {
        alert("تکایە سەرەتا چەند یاریەک دیاری بکه!");
        return;
      }

      let text = "سڵاو، داواکاری ئەم یاریانەم هەبوو:\n\n";
      let totalGB = 0;

      games.forEach(game => {
        if (selectedGameIds.includes(game.id)) {
          text += `• ${game.title} (${game.size} GB)\n`;
          totalGB += game.size;
        }
      });

      text += `\nکۆی قەبارە: ${totalGB.toFixed(2)} GB`;

      const phone = "9647515340107";
      window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`, '_blank');
    }

    renderGames();
  </script>
